# Publishes v1.0.10 at 3:00 pm Sydney time (04:00 UTC) on 18 Nov 2026.
# To cancel: Actions → "Scheduled release" → ⋯ → Disable workflow (or delete this file).
name: Scheduled release

on:
  schedule:
    - cron: "0 4 18 11 *"
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Release v1.0.10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The cron also matches 18 Nov in later years; only run this one.
          if [ "$(date -u +%Y)" != "2026" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Not 2026, nothing to do."; exit 0
          fi
          gh workflow run build.yml -R "${{ github.repository }}" -f tag=v1.0.10
          echo "Started the v1.0.10 release build."
