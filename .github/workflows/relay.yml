name: Deploy relay

on:
  push:
    branches: [main]
    paths: ["relay/**", ".github/workflows/relay.yml"]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Needs the CLOUDFLARE_API_TOKEN secret
        if: env.HAS_TOKEN != 'true'
        run: echo "Add the CLOUDFLARE_API_TOKEN repository secret to deploy the relay."
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy to Cloudflare (free plan)
        if: env.HAS_TOKEN == 'true'
        working-directory: relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy
